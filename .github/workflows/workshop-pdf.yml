name: Export Workshop to PDF

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "content/5-Workshop/**"
      - ".github/workflows/workshop-pdf.yml"
      - "scripts/export_workshop_pdf.py"

permissions:
  contents: read

jobs:
  export-workshop-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository and theme
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: "0.134.3"
          extended: true

      - name: Build Workshop pages
        run: hugo --minify --baseURL "http://127.0.0.1:8000/"

      - name: Install PDF tools
        run: |
          python -m pip install --upgrade pip
          pip install playwright pypdf
          playwright install --with-deps chromium

      - name: Export and merge Workshop pages
        run: python scripts/export_workshop_pdf.py

      - name: Upload Workshop PDF
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Kitchen-Workshop-PDF
          path: output/Smart-Kitchen-AWS-Workshop.pdf
          if-no-files-found: error
          retention-days: 30
